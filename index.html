  let lastToday = todayKey();
  setInterval(() => {
    const nowDay = todayKey();
    if (nowDay !== lastToday) { if (state.day === lastToday) state.day = nowDay; lastToday = nowDay; }   // qua nửa đêm: đang xem hôm nay thì tự sang ngày mới
    if (dlg.open || noteDlg.open || popover.classList.contains('open')) return;
    if (document.activeElement && document.activeElement.id === 'search') return;
    render();
  }, 60000);

  /* ===== MÁY TÍNH TIỀN ===== */
  const vnd = n => new Intl.NumberFormat('vi-VN').format(Math.round(n)) + ' đ';
  const readMoney = el => Number(String(el.value).replace(/\D/g, '')) || 0;
  const readPct = el => { const v = parseFloat(String(el.value).replace(',', '.')); return isFinite(v) ? Math.min(Math.max(v, 0), 100) : 0; };
  const cEl = { amount: $('#cAmount'), discount: $('#cDiscount'), deposit: $('#cDeposit'), fee: $('#cFee'), given: $('#cGiven') };
  let payMethod = 'cash';

  function formatMoneyInput(el) {
    const pos = el.selectionStart ?? el.value.length;
    const digitsBefore = el.value.slice(0, pos).replace(/\D/g, '').length;
    const n = readMoney(el);
    el.value = n ? new Intl.NumberFormat('vi-VN').format(n) : '';
    let seen = 0, i = 0;
    for (; i < el.value.length && seen < digitsBefore; i++) if (/\d/.test(el.value[i])) seen++;
    try { el.setSelectionRange(i, i); } catch (e) {}
  }

  function calc() {
    const amount = readMoney(cEl.amount), disc = readPct(cEl.discount), deposit = readMoney(cEl.deposit);
    const given = readMoney(cEl.given), feePct = readPct(cEl.fee);
    const discountAmt = Math.round(amount * disc / 100);
    const total = amount - discountAmt;
    const due = Math.max(total - deposit, 0);
    const refund = Math.max(deposit - total, 0);
    const card = payMethod === 'card';
    const feeAmt = card ? Math.round(due * feePct / 100) : 0;
    const customerPays = due + feeAmt;

    let h = `<div class="cline"><span>${L('Tiền hàng', 'Subtotal')}</span><b>${vnd(amount)}</b></div>`;
    if (disc > 0) h += `<div class="cline minus"><span>${L('Giảm giá', 'Discount')} ${disc}%</span><b>− ${vnd(discountAmt)}</b></div>`;
    if (disc > 0 || deposit > 0) h += `<div class="cline sep"><span>${L('Thành tiền', 'Total')}</span><b>${vnd(total)}</b></div>`;
    if (deposit > 0) h += `<div class="cline minus"><span>${L('Đã cọc', 'Deposit paid')}</span><b>− ${vnd(Math.min(deposit, total))}</b></div>`;
    h += `<div class="cline sep"><span>${L('Còn phải thu', 'Balance due')}</span><b>${vnd(due)}</b></div>`;
    if (card) h += `<div class="cline"><span>${L('Phí cà thẻ', 'Card fee')} ${feePct}%</span><b>${vnd(feeAmt)}</b></div>`;
    h += `<div class="ctotal"><span>${card ? L('💳 Khách cà thẻ', '💳 Customer pays by card') : L('💵 Khách trả tiền mặt', '💵 Customer pays cash')}</span><b>${vnd(customerPays)}</b></div>`;
    if (!card && given > 0) {
      const diff = given - customerPays;
      h += diff >= 0
        ? `<div class="cline" style="margin-top:6px;color:var(--ok);font-weight:700"><span>${L('Tiền thối lại', 'Change')}</span><span>${vnd(diff)}</span></div>`
        : `<div class="cline" style="margin-top:6px;color:var(--danger);font-weight:700"><span>${L('Khách còn thiếu', 'Still owed')}</span><span>${vnd(-diff)}</span></div>`;
    }
    if (refund > 0) h += `<div style="margin-top:6px;font-size:13px;color:var(--danger)">${L('⚠ Khách cọc dư', '⚠ Deposit exceeds total by')} <b>${vnd(refund)}</b></div>`;
    $('#cOut').innerHTML = h;
  }

  function syncMethodUI() {
    $('#cMethod').querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.m === payMethod));
    $('#cCardOpts').hidden = payMethod !== 'card';
    $('#cGivenWrap').style.display = payMethod === 'card' ? 'none' : '';
  }

  ['amount', 'deposit', 'given'].forEach(k => cEl[k].addEventListener('input', () => { formatMoneyInput(cEl[k]); calc(); }));
  cEl.discount.addEventListener('input', calc);
  cEl.fee.addEventListener('input', calc);
  $('#cMethod').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { payMethod = b.dataset.m; syncMethodUI(); calc(); } });
  $('#calcReset').onclick = () => {
    ['amount', 'discount', 'deposit', 'given'].forEach(k => cEl[k].value = '');
    cEl.fee.value = '0';
    payMethod = 'cash'; syncMethodUI(); calc(); cEl.amount.focus();
  };
  cEl.fee.addEventListener('focus', () => cEl.fee.select());   // bấm vào là chọn sẵn số 0, gõ số mới đè lên ngay
  syncMethodUI(); calc();

  /* ===== NGÔN NGỮ: dịch phần HTML tĩnh + nút VIE/ENG ===== */
  const STATIC = [
    ['.brand h1', 'Work Schedule'], ['.brand small', 'Pickup · Fitting · Delivery'],
    ['#prevDay', 'Previous day', 'aria-label'], ['#today', 'Today'], ['#nextDay', 'Next day', 'aria-label'],
    ['#btnNotify', 'Remind me of upcoming tasks', 'title'], ['#btnMenu .mn-txt', ' Tools ▾'],
    ['#btnPrint', '🖨 Print schedule'], ['#btnFixItems', '🧵 Convert old items to item lists…'], ['#btnExport', '⬇ Export backup file'], ['#btnImport', '⬆ Import backup file'],
    ['#btnBkPick', '💾 Turn on auto backup…'], ['#btnBkRename', '✏ Rename / change location…'], ['#btnBkNow', '🔄 Back up now'], ['#btnBkOff', '⏹ Turn off auto backup'],
    ['#btnAdd', '＋ Add schedule'],
    ['.tab[data-tab="day"]', 'Daily schedule'], ['.tab[data-tab="week"]', 'Next 7 days'],
    ['.tab[data-tab="orders"]', 'All orders'], ['#lateTabTxt', 'Late / overdue'], ['.tab[data-tab="calc"]', '🧮 Calculator'],
    ['#popover', 'Customer details', 'aria-label'], ['#popClose', 'Close', 'aria-label'],
    ['#popEdit', '✎ Edit this order'],
    ['label[for="cAmount"]', 'Subtotal (đ)'], ['#cAmount', 'e.g. 3.500.000', 'placeholder'],
    ['label[for="cDiscount"]', 'Discount (%)'], ['label[for="cDeposit"]', 'Deposit paid (đ)'],
    ['#cMethodLbl', 'Payment method'], ['#cMethod [data-m="cash"]', '💵 Cash'], ['#cMethod [data-m="card"]', '💳 Card'],
    ['label[for="cFee"]', 'Card fee (%)'], ['label[for="cGiven"]', 'Customer gives (đ)'], ['#cGiven', 'e.g. 4.000.000', 'placeholder'],
    ['#calcReset', '↺ Reset'],
    ['label[for="fName"]', 'Customer name *'], ['#fName', 'e.g. David Sin', 'placeholder'],
    ['#acList', 'Customer name suggestions', 'aria-label'],
    ['label[for="fNote"]', 'General note'], ['#fNote', 'Measurements, alteration requests...', 'placeholder'],
    ['#addJob', '＋ Add another tailor'], ['#btnDelete', 'Delete order'], ['#btnCancel', 'Cancel'],
    ['#orderForm button[type="submit"]', 'Save'],
    ['#noteModalClear', 'Clear note'], ['#noteModalText', 'Write a note for this day...', 'placeholder'],
    ['#noteModalText', 'Note content', 'aria-label'], ['#noteModalClose', 'Close'], ['#noteModalState', 'Auto-saved']
  ];
  function applyStatic() {
    STATIC.forEach(([sel, en, attr]) => {
      const el = document.querySelector(sel); if (!el) return;
      const k = 'vi' + (attr || 'text').replace(/\W/g, '');
      if (el.dataset[k] === undefined) el.dataset[k] = attr ? (el.getAttribute(attr) || '') : el.textContent;
      const v = lang === 'en' ? en : el.dataset[k];
      if (attr) el.setAttribute(attr, v); else el.textContent = v;
    });
    document.documentElement.lang = lang;
    document.title = L('Lịch Làm Việc', 'Work Schedule');
    document.querySelectorAll('#langSeg button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  }
  function setLang(l) {
    lang = l === 'en' ? 'en' : 'vi';
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    applyStatic(); updateNotifyBtn(); renderBkStatus(); calc(); updateFullBtn(); render();
  }
  $('#langSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (b && b.dataset.lang !== lang) setLang(b.dataset.lang);
  });
  /* ===== TOÀN MÀN HÌNH ===== */
  const btnFull = $('#btnFull');
  const rootEl = document.documentElement;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  btnFull.hidden = !(rootEl.requestFullscreen || rootEl.webkitRequestFullscreen);
  function updateFullBtn() {
    const on = !!fsEl(), label = on ? L('Thoát toàn màn hình', 'Exit full screen') : L('Toàn màn hình', 'Full screen');
    btnFull.title = label; btnFull.setAttribute('aria-label', label); btnFull.classList.toggle('on', on);
    btnFull.querySelector('path').setAttribute('d', on ? 'M3 8h5V3M16 3v5h5M21 16h-5v5M8 21v-5H3' : 'M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5');
  }
  btnFull.onclick = async () => {
    try {
      if (fsEl()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else await (rootEl.requestFullscreen || rootEl.webkitRequestFullscreen).call(rootEl);
    } catch (e) { toast(L('⚠ Trình duyệt không cho phép bật toàn màn hình', '⚠ The browser did not allow full screen')); }
  };
  document.addEventListener('fullscreenchange', updateFullBtn);
  document.addEventListener('webkitfullscreenchange', updateFullBtn);
  updateFullBtn();

  applyStatic();

  render();
})();
</script>
</body>
</html>
