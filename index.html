<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lịch Làm Việc">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4f6fb">
<title>Lịch Làm Việc v2.0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📅%3C/text%3E%3C/svg%3E">
<style>

  :root {
    --bg: #f4f6fb; --card: #fff; --text: #1f2430; --muted: #6b7280; --line: #e5e8ef;
    --primary: #1a73e8; --danger: #d93025; --ok: #188038; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; }
  .app { max-width: 1500px; margin: 0 auto; padding: 16px; }

  header.top { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon { width: 42px; height: 42px; border-radius: 11px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 22px; flex: none; }
  .brand h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; line-height: 1.15; }
  .brand small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .menu { position: relative; }
  .menu-list { display: none; position: absolute; right: 0; top: calc(100% + 6px); min-width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 6px; z-index: 30; }
  .menu.open .menu-list { display: block; }
  .menu-list button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 10px 12px; border-radius: 8px; font-size: 15px; }
  .menu-list button:hover { background: #eef2fb; }
  .menu-list hr { border: none; border-top: 1px solid var(--line); margin: 4px 0; }
  .bk-status { padding: 8px 12px 4px; font-size: 14px; line-height: 1.45; color: var(--muted); }

  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 15px; transition: .15s; }
  button:hover { background: #eef2fb; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover { background: #1558b8; }
  button.danger { color: var(--danger); border-color: #f3c3bf; }
  button.danger:hover { background: #fdecea; }
  button.small { padding: 4px 10px; font-size: 14px; }

  .datebar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--card); padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 14px; }
  .datebar .nav { display: inline-flex; align-items: center; gap: 6px; }
  .datebar .label { flex: 1; min-width: 200px; font-weight: 700; font-size: 18px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
  .datebar .label .rel { font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #e8f0fe; color: var(--primary); }
  .datebar .label .rel.other { background: #f1f3f7; color: var(--muted); }

  .home.with-cal { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 14px; align-items: start; }
  .side { display: none; }
  .home.with-cal .side { display: block; position: sticky; top: 12px; }
  .cal { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; font-size: 15px; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-weight: 700; font-size: 16px; }
  .cal-nav { display: inline-flex; gap: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  
  .cal-dow { text-align: center; font-size: 13.5px; font-weight: 800; color: #374151; padding: 6px 0; background: #f8fafc; border-radius: 6px; }
  .cal-dow.sun { color: var(--danger); background: #fde8e8; }

  .cal-day { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 44px; padding: 4px 0; border-radius: 8px; border: 1px solid transparent; background: none; font-size: 15px; cursor: pointer; }
  .cal-day:hover { background: #eef2fb; }
  .cal-day .sd { font-weight: 700; color: #1f2430; }
  .cal-day.sun-day .sd { color: var(--danger); font-weight: 800; }
  .cal-day.today { border-color: var(--primary); }
  .cal-day.sel { background: var(--primary) !important; color: #fff !important; }
  .cal-day.sel .sd, .cal-day.sel.sun-day .sd { color: #fff !important; }
  .cal-day .nd { position: absolute; top: 4px; left: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
  .cal-day.sel .nd { background: #fff; }
  .cal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }

  .tab-n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 2px; border-radius: 10px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; }
  .late-days { font-size: 12.5px; font-weight: 700; color: var(--danger); margin: 0 0 4px 2px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 2px solid var(--line); }
  .tab { border: none; background: none; border-radius: 8px 8px 0 0; padding: 10px 16px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; font-size: 16px; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 700; background: none; }

  .filters { margin-bottom: 14px; }
  .search { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 16px; }

  .group-title { margin: 14px 0 8px; font-size: 15px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .group-title.overdue { color: var(--danger); }

  .board { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 12px; align-items: start; }
  .col { background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--c); border-radius: var(--radius); overflow: hidden; }
  .col-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; background: #fafbfd; border-bottom: 1px solid var(--line); }
  .col-head b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .col-head span { flex: none; white-space: nowrap; }
  .col-sub { padding: 5px 14px; font-size: 13px; font-weight: 700; color: #5b6578; background: #f5f7fb; border-bottom: 1px solid var(--line); }
  .col-head span { font-weight: 700; color: var(--muted); background: #eef1f6; border-radius: 999px; padding: 2px 10px; font-size: 14px; }
  .col-body { padding: 10px; }
  .col-empty { text-align: center; color: var(--muted); padding: 12px 6px; font-size: 15px; }

  .ccard { position: relative; background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .ccard.done { opacity: .55; background: #fafafa; } 
  .ccard.done .ctitle { text-decoration: line-through; color: var(--muted); }
  .ccard.late { background: #fff6f5; border-color: #f3c3bf; border-left-color: var(--danger); }
  
  .ccard-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; padding-right: 28px; }
  .ctitle { font-weight: 700; font-size: 16px; color: #111827; cursor: pointer; word-break: break-word; line-height: 1.3; }
  .ctitle:hover { color: var(--primary); }

  .ccard-row2 { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .ctime { font-weight: 700; font-size: 13px; color: #1d4ed8; background: #eff6ff; border: 1px solid #bfdbfe; padding: 2px 8px; border-radius: 6px; }

  .ccard .edit-btn { position: absolute; top: 8px; right: 8px; border: none; background: #f3f4f6; color: #4b5563; padding: 3px 8px; font-size: 13px; border-radius: 6px; cursor: pointer; }
  .ccard .edit-btn:hover { background: #e5e7eb; color: #111; }

  .citems { font-size: 14px; color: #374151; font-weight: 600; margin-bottom: 6px; word-break: break-word; cursor: pointer; }
  
  .sub-events-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .sub-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 7px; border-radius: 6px; background: #f8fafc; border: 1px solid var(--line); color: #334155; cursor: pointer; }
  .sub-chip.is-done { background: #ecf8f0; border-color: #bbf7d0; color: var(--ok); text-decoration: line-through; }
  .sub-chip .chip-time { font-weight: 700; color: #1d4ed8; }
  .sub-chip.is-done .chip-time { color: var(--ok); }
  
  .cnext { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
  .cnext-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .cnext-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 4px; font-size: 13.5px; border-radius: 6px; cursor: pointer; }
  .cnext-item:hover { background: #f0f4fc; }
  .cnext-item.is-done { opacity: 0.55; text-decoration: line-through; }
  .cnext-info { min-width: 0; flex: 1; white-space: normal; overflow-wrap: anywhere; line-height: 1.3; }

  /* Popover chi tiết định vị thông minh không bị tràn */
  .popover { position: absolute; display: none; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.15); padding: 14px; width: 320px; z-index: 100; font-size: 14px; }
  .popover.open { display: block; }
  .pop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: 16px; }
  .pop-close { border: none; background: none; font-size: 16px; cursor: pointer; color: var(--muted); }
  .pop-line { margin-bottom: 6px; line-height: 1.4; display: flex; flex-direction: column; }
  .pop-line .pop-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .pop-line .pop-val { font-size: 14px; font-weight: 600; }
  .pop-foot { margin-top: 8px; text-align: right; border-top: 1px dashed var(--line); padding-top: 8px; }
  .badge-done-pop { background: #ecf8f0; color: var(--ok); font-size: 12px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }

  /* Popup Ghi Chú Ngày (Modal) */
  dialog#noteDlg { border: none; border-radius: 14px; padding: 0; width: min(460px, 92vw); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  dialog#noteDlg::backdrop { background: rgba(0,0,0,.4); }
  .note-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 17px; background: #f8f9fb; }
  .note-modal-body { padding: 16px; }
  .note-modal-body textarea { width: 100%; min-height: 140px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 15px; line-height: 1.45; background: #fffef8; }
  .note-modal-body textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  .note-modal-foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); background: #f8f9fb; font-size: 13px; color: var(--muted); }

  .ccard input[type=checkbox], .event input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--ok); flex: none; }

  .event { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 15px; }
  .event.done { opacity: .55; }
  .time { min-width: 60px; font-weight: 700; font-size: 15px; }
  .body { flex: 1; min-width: 0; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px; color: #fff; background: var(--c); }
  .badge.soon { background: #d97706; }
  .badge.late { background: var(--danger); }

  .empty { text-align: center; color: var(--muted); padding: 20px 10px; background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); font-size: 15px; }

  .order-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; font-size: 15px; }
  .order-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .order-head b { font-size: 17px; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 8px; }
  .step { font-size: 14px; padding: 8px 10px; border-radius: 8px; background: #f8f9fb; border-left: 4px solid var(--c); }

  dialog#dlg { border: none; border-radius: 12px; padding: 0; width: min(1000px, 94vw); max-height: 94vh; box-shadow: 0 20px 50px rgba(0,0,0,.2); font-size: 15px; }
  dialog#dlg::backdrop { background: rgba(0,0,0,.4); }
  .modal-head { padding: 12px 18px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 18px; }
  .modal-body { padding: 14px 18px; max-height: calc(94vh - 110px); overflow: auto; }
  .modal-foot { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: space-between; }
  .top-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 10px; align-items: end; margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  .field input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; }
  /* Gợi ý tên khách khi gõ */
  .field.ac { position: relative; }
  .ac-list { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60; background: #fff; border: 1px solid #c7d6f2; border-radius: 10px; box-shadow: 0 12px 30px rgba(15,23,42,.18); padding: 4px; max-height: 300px; overflow: auto; }
  .ac-list.open { display: block; }
  .ac-head { padding: 6px 10px 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .ac-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 15px; }
  .ac-item:hover, .ac-item.active { background: #e8f0fe; }
  .ac-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-name b { color: var(--primary); font-weight: 800; }
  .ac-meta { flex: none; font-size: 12.5px; color: var(--muted); }
  .ac-del { flex: none; border: none; background: none; padding: 2px 6px; border-radius: 6px; color: #9ca3af; font-size: 13px; opacity: 0; }
  .ac-item:hover .ac-del, .ac-item.active .ac-del { opacity: 1; }
  .ac-del:hover { background: #fdecea; color: var(--danger); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .job-title { font-weight: 700; font-size: 17px; color: var(--c); }

  .job { border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 8px 10px; background: #fcfcfe; margin-bottom: 10px; }
  .job-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .j-items { flex: 1; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; }
  
  .tl-block { display: grid; grid-template-columns: 1fr 100px 1.2fr auto; gap: 6px; align-items: center; border-left: 4px solid var(--c); padding: 4px 0 4px 8px; margin-bottom: 6px; }
  .tl-label { font-size: 14px; font-weight: 600; }
  .tl-block input[type=date], .tl-block select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; background: #fff; }
  .tl-block .clear { color: var(--danger); padding: 4px 8px; font-size: 14px; border-radius: 6px; }
  
  .cust-card-wrap { border: 2px solid var(--c); border-left-width: 6px; border-radius: 10px; padding: 10px; background: color-mix(in srgb, var(--c) 8%, #fff); }
  .cust-card-wrap .tl-block { border: none; padding: 0; margin-bottom: 6px; }
  .cust-card-wrap .tl-label { font-size: 15px; font-weight: 700; color: color-mix(in srgb, var(--c) 70%, #000); }
  .cust-items-input { width: 100%; padding: 7px 10px; border: 1px solid color-mix(in srgb, var(--c) 40%, #ccc); border-radius: 8px; font: inherit; font-size: 15px; background: #fff; }

  /* Máy tính tiền */
  .calc { display: none; max-width: 900px; margin: 8px auto 0; background: var(--card); border: 1px solid var(--line); border-top: 6px solid var(--primary); border-radius: var(--radius); overflow: hidden; font-size: 15px; }
  .calc-reset { width: 100%; margin-top: 4px; padding: 10px; font-size: 15px; color: var(--muted); }
  .calc-body { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; padding: 16px; }
  .cfield { margin-bottom: 10px; }
  .cfield label { display: block; font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .cfield input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 18px; font-weight: 600; text-align: right; }
  .crow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: none; padding: 8px; font-size: 15px; background: #fff; }
  .seg button.active { background: var(--primary); color: #fff; font-weight: 700; }
  .calc-out { background: #f8f9fb; border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .cline { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 15px; color: var(--muted); }
  .cline.sep { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 8px; }
  .ctotal { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--primary); color: #fff; display: flex; justify-content: space-between; align-items: baseline; }
  .ctotal b { font-size: 24px; }
  .bk-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; padding: 10px 14px; border: 1px solid #f0c36d; border-left: 5px solid #f59e0b; border-radius: 10px; background: #fff8e6; color: #7a4b00; font-size: 14px; font-weight: 600; }
  .bk-banner[hidden] { display: none; }
  .bk-banner span { flex: 1 1 260px; }
  .bk-banner .bk-x { border: none; background: transparent; color: #7a4b00; padding: 2px 6px; }
  /* ===== Thanh đầu trang mới: thương hiệu + thao tác · tab + điều hướng ngày · chỉ số theo dõi ===== */
  .topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 16px; padding: 2px 0 12px; }
  .topbar .actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
  .topbar .primary { padding: 9px 18px; font-weight: 700; border-radius: 10px; box-shadow: 0 1px 3px rgba(26,115,232,.4); }
  .topbar #btnNotify { border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .topbar .lang-seg button { padding: 8px 11px; font-size: 13px; }
  .act-sep { width: 1px; height: 26px; background: var(--line); margin: 0 2px; }
  .toolrow { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; padding: 6px; margin-bottom: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .toolrow .tabs { border: none; margin: 0; padding: 0; gap: 4px; overflow: visible; flex-wrap: wrap; }
  .toolrow .tab { border: none; margin: 0; border-radius: 10px; padding: 9px 16px; font-size: 15px; font-weight: 600; color: var(--muted); background: none; }
  .toolrow .tab:hover { background: #eef2fb; color: var(--text); }
  .toolrow .tab.active { background: var(--primary); color: #fff; font-weight: 700; }
  .toolrow .datebar { flex: 0 1 auto; margin: 0; padding: 0 6px 0 0; background: none; border: none; border-radius: 0; gap: 8px 12px; flex-wrap: wrap; justify-content: flex-end; }
  .toolrow .datebar .label { flex: 0 1 auto; min-width: 0; font-size: 17px; }
  .toolrow .datebar .note-btn { margin-left: 0; }
  .kpi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi[hidden] { display: none; }
  .kpi-tile { --k: var(--primary); display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--k); border-radius: 12px; padding: 10px 14px; cursor: default; }
  button.kpi-tile { cursor: pointer; }

<script>
(() => {
  'use strict';

  // ===== NGÔN NGỮ (VIE / ENG) =====
  const LANG_KEY = 'phiphi_lang_v1';
  let lang = 'vi';
  try { lang = localStorage.getItem(LANG_KEY) === 'en' ? 'en' : 'vi'; } catch (e) {}
  const L = (vi, en) => lang === 'en' ? en : vi;

  const STORAGE_KEY = 'phiphi_schedule_v2';
  const NOTES_KEY = 'phiphi_day_notes_v1';
  const NOTIFY_KEY = 'phiphi_notify_v1';
  const CUST_KEY = 'phiphi_customers_v1';
  const SOON_MINUTES = 60;

  // fixed: có ô cố định trong form (2 thợ chính). Thợ còn lại thêm bằng nút "Thêm thợ khác".
  const TAILORS = [
    { name: 'Anh Phương', color: '#0ea5e9', fixed: true },
    { name: 'Chất',       color: '#d946ef', fixed: true },
    { name: 'Khác',       color: '#64748b', fixed: false }
  ];
  const OTHER = 'Khác';   // giá trị lưu trong dữ liệu — không đổi theo ngôn ngữ
  const tl = n => (n === OTHER && lang === 'en') ? 'Other' : n;   // tên hiển thị

  const EVENT_TYPES = {
    pickupFitting:  { get label() { return L('🛵 Lấy thử', '🛵 Pick up (fitting)'); }, get chip() { return L('🛵 Thử', '🛵 Fit'); }, color: '#f59e0b' },
    pickupRepair:   { get label() { return L('🛵 Lấy sửa', '🛵 Pick up (repair)'); }, get chip() { return L('🛵 Sửa', '🛵 Fix'); }, color: '#eab308' },
    pickupFinished: { get label() { return L('📦 Giao đồ', '📦 Deliver (finished)'); }, get chip() { return L('📦 Giao', '📦 Drop'); }, color: '#8b5cf6' },
    fitting:        { get label() { return L('👤 Khách thử đồ', '👤 Customer fitting'); }, get chip() { return L('👤 Thử', '👤 Fit'); }, color: '#10b981' },
    delivery:       { get label() { return L('✅ Khách lấy đồ', '✅ Customer pickup'); }, get chip() { return L('✅ Lấy', '✅ Pick'); }, color: '#ef4444' }
  };
  const JOB_TYPES = ['pickupFitting', 'pickupRepair', 'pickupFinished'];

  const $ = (s, r = document) => r.querySelector(s);
  const pad = n => String(n).padStart(2, '0');
  const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dateKey(d); };
  const todayKey = () => dateKey(new Date());
  const nowKey = () => { const d = new Date(); return `${dateKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const WD = { vi: ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'], en: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] };
  const SWD = { vi: ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };
  const MONTHS_EN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const weekdays = () => WD[lang], shortWeekdays = () => SWD[lang];

  const fmtDate = k => { const d = parseKey(k); return `${weekdays()[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
  // Giờ hiển thị dạng am/pm gọn: 8:45am · 9am · 12pm · 4:30pm (dữ liệu bên trong vẫn lưu 24h "HH:mm")
  const fmtHM = hm => {
    const [h = 0, m = 0] = String(hm || '00:00').split(':').map(Number);
    const h12 = h % 12 || 12;
    return `${h12}${m ? ':' + pad(m) : ''}${h >= 12 ? 'pm' : 'am'}`;
  };
  // Mốc chỉ có ngày (khách chưa hẹn giờ) được lưu dạng "YYYY-MM-DDT" (phần giờ để trống)
  const hasTime = at => !!((at.split('T')[1] || '').slice(0, 5));
  const noTime = () => L('Chưa hẹn giờ', 'Time TBD');
  const fmtTimeOnly = at => hasTime(at) ? fmtHM(at.split('T')[1].slice(0, 5)) : noTime();
  const fmtCompactDateTime = at => {
    const d = parseKey(at.split('T')[0]);
    return `${shortWeekdays()[d.getDay()]}${hasTime(at) ? ' ' + fmtTimeOnly(at) : ''} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(-2)}`;
  };
  const fmtFull = at => {
    const d = parseKey(at.split('T')[0]);
    const ds = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
    return hasTime(at) ? `${weekdays()[d.getDay()]}, ${fmtTimeOnly(at)}, ${ds}` : `${weekdays()[d.getDay()]}, ${ds} (${noTime().toLowerCase()})`;
  };
  const dayDiffLabel = k => {
    const diff = Math.round((parseKey(k) - parseKey(todayKey())) / 864e5);
    return diff === 0 ? L('Hôm nay', 'Today') : diff === 1 ? L('Ngày mai', 'Tomorrow') : diff === -1 ? L('Hôm qua', 'Yesterday') : '';
  };

  /* ===== ÂM LỊCH (thuật toán Hồ Ngọc Đức, múi giờ GMT+7) ===== */
  const LUNAR_TZ = 7, PI = Math.PI;
  const CAN = ['Giáp', 'Ất', 'Bính', 'Đinh', 'Mậu', 'Kỷ', 'Canh', 'Tân', 'Nhâm', 'Quý'];
  const CHI = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
  const jdFromDate = (dd, mm, yy) => {
    const a = Math.floor((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
    let jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
    if (jd < 2299161) jd = dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - 32083;
    return jd;
  };
  const newMoonJd = k => {
    const T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = PI / 180;
    let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
    Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
    const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
    const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
    const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
    let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
    C1 -= 0.4068 * Math.sin(Mpr * dr) - 0.0161 * Math.sin(dr * 2 * Mpr);
    C1 -= 0.0004 * Math.sin(dr * 3 * Mpr);
    C1 += 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
    C1 -= 0.0074 * Math.sin(dr * (M - Mpr)) - 0.0004 * Math.sin(dr * (2 * F + M));
    C1 -= 0.0004 * Math.sin(dr * (2 * F - M)) + 0.0006 * Math.sin(dr * (2 * F + Mpr));
    C1 += 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
    const dt = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3 : -0.000278 + 0.000265 * T + 0.000262 * T2;
    return Jd1 + C1 - dt;
  };
  const newMoonDay = k => Math.floor(newMoonJd(k) + 0.5 + LUNAR_TZ / 24);
  const sunLongitude = jdn => {
    const T = (jdn - 2451545.5 - LUNAR_TZ / 24) / 36525, T2 = T * T, dr = PI / 180;
    const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
    const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
    let DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M);
    DL += (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
    let lng = (L0 + DL) * dr;
    lng -= PI * 2 * Math.floor(lng / (PI * 2));
    return Math.floor(lng / PI * 6);
  };
  const lunarMonth11 = yy => {
    const off = jdFromDate(31, 12, yy) - 2415021, k = Math.floor(off / 29.530588853);
    let nm = newMoonDay(k);
    if (sunLongitude(nm) >= 9) nm = newMoonDay(k - 1);
    return nm;
  };
  const leapMonthOffset = a11 => {
    const k = Math.floor((a11 - 2415021.076998695) / 29.530588853 + 0.5);
    let last = 0, i = 1, arc = sunLongitude(newMoonDay(k + i));
    do { last = arc; i++; arc = sunLongitude(newMoonDay(k + i)); } while (arc !== last && i < 14);
    return i - 1;
  };
  function solar2Lunar(dd, mm, yy) {
    const dayNumber = jdFromDate(dd, mm, yy), k = Math.floor((dayNumber - 2415021.076998695) / 29.530588853);
    let monthStart = newMoonDay(k + 1);
    if (monthStart > dayNumber) monthStart = newMoonDay(k);
    let a11 = lunarMonth11(yy), b11 = a11, lunarYear;
    if (a11 >= monthStart) { lunarYear = yy; a11 = lunarMonth11(yy - 1); }
    else { lunarYear = yy + 1; b11 = lunarMonth11(yy + 1); }
    const lunarDay = dayNumber - monthStart + 1, diff = Math.floor((monthStart - a11) / 29);
    let lunarLeap = 0, lunarMonth = diff + 11;
    if (b11 - a11 > 365) {
      const leapDiff = leapMonthOffset(a11);
      if (diff >= leapDiff) { lunarMonth = diff + 10; if (diff === leapDiff) lunarLeap = 1; }
    }
    if (lunarMonth > 12) lunarMonth -= 12;
    if (lunarMonth >= 11 && diff < 4) lunarYear -= 1;
    return { d: lunarDay, m: lunarMonth, y: lunarYear, leap: lunarLeap, jd: dayNumber };
  }
  const lunarCache = new Map();
  function lunarOf(k) {
    let r = lunarCache.get(k);
    if (!r) {
      const d = parseKey(k), l = solar2Lunar(d.getDate(), d.getMonth() + 1, d.getFullYear());
      r = { ...l, dayCC: CAN[(l.jd + 9) % 10] + ' ' + CHI[(l.jd + 1) % 12], yearCC: CAN[(l.y + 6) % 10] + ' ' + CHI[(l.y + 8) % 12] };
      lunarCache.set(k, r);
    }
    return r;
  }
  const lunarShort = k => { const l = lunarOf(k); return `${l.d}/${l.m}${l.leap ? L(' nhuận', ' (leap)') : ''}`; };
  const lunarLabel = k => { const l = lunarOf(k); return `${L('Âm lịch', 'Lunar')} ${lunarShort(k)} · ${L('ngày', 'day')} ${l.dayCC}, ${L('năm', 'year')} ${l.yearCC}`; };
  const lunarCell = k => { const l = lunarOf(k); return `<span class="ld${l.d === 1 ? ' first' : ''}" title="${esc(lunarLabel(k))}">${l.d === 1 ? l.d + '/' + l.m + (l.leap ? 'n' : '') : l.d}</span>`; };
  const lunarChip = k => `<span class="rel lunar" title="${esc(lunarLabel(k))}">🌙 ${L('Âm lịch', 'Lunar')} ${lunarShort(k)}</span>`;

  const tailorColor = n => (TAILORS.find(t => t.name === n) || { color: '#64748b' }).color;
  const colKeyOfTailor = n => TAILORS.some(t => t.name === n) ? n : OTHER;
  const emptyEv = () => ({ at: '', items: '', extra: '', lines: [], done: false });
  let toastTimer;
  const toast = msg => {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), Math.min(2200 + msg.length * 40, 8000));
  };

  /* ===== DỮ LIỆU ===== */
  // Danh sách đồ của khách: mỗi dòng = số lượng + tên món + ghi chú + đã giao/lấy chưa
  const ITEM_PRESETS = ['Suit', 'Jacket', 'Quần', 'Vest', 'Gile', 'Sơ mi', 'Măng tô', 'Chân váy'];
  const normLine = l => ({
    qty: Math.min(99, Math.max(1, parseInt(l && l.qty, 10) || 1)),
    name: String((l && l.name) || '').trim(),
    note: String((l && l.note) || '').trim(),
    done: !!(l && l.done)
  });
  const lineText = lines => lines.map(l => `${l.qty} ${l.name}${l.note ? ` (${l.note})` : ''}`).join(', ');
  const normEv = e => ({
    at: e && typeof e.at === 'string' ? e.at : '',
    items: e && typeof e.items === 'string' ? e.items : '',
    extra: e && typeof e.extra === 'string' ? e.extra : '',
    lines: e && Array.isArray(e.lines) ? e.lines.map(normLine).filter(l => l.name) : [],
    done: !!(e && e.done)
  });
  const normJob = j => ({
    tailor: (j && j.tailor) || OTHER,
    items: (j && typeof j.items === 'string') ? j.items : '',
    pickupFitting: normEv(j && j.pickupFitting),
    pickupRepair: normEv(j && j.pickupRepair),
    pickupFinished: normEv(j && j.pickupFinished)
  });
  const newJob = tailor => normJob({ tailor });

  function migrate(o) {
    if (!o || typeof o !== 'object') return null;
    if (!Array.isArray(o.jobs)) {
      // Định dạng cũ (v1) -> định dạng mới
      const old = o.events || {}, groups = {};
      (o.items || []).forEach(i => { const t = i.tailor || OTHER; (groups[t] = groups[t] || []).push(i.name); });
      let jobs = Object.entries(groups).map(([tailor, names]) => ({ tailor, items: names.join(', ') }));
      if (!jobs.length) jobs = [{ tailor: TAILORS[0].name, items: '' }];
      jobs.forEach(j => {
        if (old.pickupFitting && old.pickupFitting.at) j.pickupFitting = { ...old.pickupFitting };
        if (old.pickupFinished && old.pickupFinished.at) j.pickupFinished = { ...old.pickupFinished };
      });
      o = { id: o.id, name: o.name, note: o.note, jobs, fitting: old.fitting, delivery: old.delivery };
    }
    return {
      id: o.id || uid(),
      name: String(o.name || '(Không tên)'),
      note: typeof o.note === 'string' ? o.note : '',
      jobs: o.jobs.map(normJob),
      fitting: normEv(o.fitting),
      delivery: normEv(o.delivery)
    };
  }
  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(raw)) return raw.map(migrate).filter(Boolean);
    } catch (e) {
      // Dữ liệu bị hỏng: cất bản gốc sang khóa khác để còn cứu được, không để lần lưu kế tiếp ghi đè mất
      try { const bad = localStorage.getItem(STORAGE_KEY); if (bad) localStorage.setItem(STORAGE_KEY + '_corrupt_' + Date.now(), bad); } catch (e2) {}
    }
    return [];
  }
  const loadNotes = () => {
    try { const n = JSON.parse(localStorage.getItem(NOTES_KEY)); return n && typeof n === 'object' && !Array.isArray(n) ? n : {}; }
    catch (e) { return {}; }
  };

  let orders = load();
  let notes = loadNotes();

  /* ===== DANH SÁCH TÊN KHÁCH (nhớ lâu dài, kể cả khi đơn đã bị xóa) ===== */
  // Chuẩn hóa để so khớp: bỏ dấu tiếng Việt, không phân biệt hoa/thường, gộp khoảng trắng.
  // Chuẩn hóa từng ký tự một (độ dài giữ nguyên) để còn tô đậm đúng đoạn khớp trên tên gốc.
  const normChar = c => c === 'đ' || c === 'Đ' ? 'd' : c.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().slice(0, 1) || c.toLowerCase();
  const normStr = s => [...String(s)].map(normChar).join('');
  const nameKey = s => normStr(s).trim().replace(/\s+/g, ' ');
  const cleanName = s => String(s || '').trim().replace(/\s+/g, ' ');

  let customers = [];   // [{ name, last }]
  const loadCustomers = () => {
    try { const c = JSON.parse(localStorage.getItem(CUST_KEY)); return Array.isArray(c) ? c.filter(x => x && typeof x.name === 'string') : []; }
    catch (e) { return []; }
  };
  const saveCustomers = () => {
    try { localStorage.setItem(CUST_KEY, JSON.stringify(customers)); } catch (e) { /* bỏ qua */ }
    scheduleBackup();
  };
  // Thêm tên vào danh sách (nếu đã có thì chỉ cập nhật lần dùng gần nhất, giữ cách viết vừa nhập)
  function rememberCustomer(name, last) {
    name = cleanName(name); if (!name) return false;
    const k = nameKey(name), hit = customers.find(c => nameKey(c.name) === k);
    if (hit) {
      // Giữ cách viết đầy đủ hơn (có dấu, viết hoa); gõ lại bằng chữ thường không làm mất cách viết đẹp đã lưu
      const score = s => [...s].reduce((t, ch) => t + (ch !== ch.normalize('NFD').replace(/[̀-ͯ]/g, '') || ch === 'đ' || ch === 'Đ' ? 2 : 0) + (ch !== ch.toLowerCase() ? 1 : 0), 0);
      if (score(name) >= score(hit.name)) hit.name = name;
      hit.last = Math.max(hit.last || 0, last || Date.now()); return false;
    }
    customers.push({ name, last: last || Date.now() });
    return true;
  }
  customers = loadCustomers();
  // Bổ sung các tên đang có trong đơn (đơn cũ trước khi có tính năng này)
  { let added = false; orders.forEach((o, i) => { if (rememberCustomer(o.name, i + 1)) added = true; }); if (added) { try { localStorage.setItem(CUST_KEY, JSON.stringify(customers)); } catch (e) {} } }
  const orderCount = name => { const k = nameKey(name); return orders.filter(o => nameKey(o.name) === k).length; };

  // Gợi ý: tên bắt đầu bằng chữ vừa gõ → từ nào đó trong tên bắt đầu bằng chữ vừa gõ → có chứa. Ưu tiên khách có nhiều đơn / dùng gần đây.
  function suggestCustomers(q) {
    const nq = nameKey(q);
    if (!nq) return customers.slice().sort((a, b) => (b.last || 0) - (a.last || 0)).slice(0, 6).map(c => ({ c, start: -1 }));
    const out = [];
    customers.forEach(c => {
      const n = nameKey(c.name); let rank, start;
      if (n.startsWith(nq)) { rank = 0; start = 0; }
      else { const w = n.split(' '); let pos = 0, wi = -1; for (let i = 0; i < w.length; i++) { if (w[i].startsWith(nq)) { wi = i; break; } pos += w[i].length + 1; } if (wi >= 0) { rank = 1; start = pos; } else { const ix = nq.length >= 3 ? n.indexOf(nq) : -1; if (ix < 0) return; rank = 2; start = ix; } }   // khớp giữa tên chỉ khi gõ từ 3 chữ, tránh nhiễu khi mới gõ 1-2 chữ cái
      out.push({ c, rank, start, cnt: orderCount(c.name) });
    });
    out.sort((a, b) => a.rank - b.rank || b.cnt - a.cnt || (b.c.last || 0) - (a.c.last || 0) || a.c.name.localeCompare(b.c.name, 'vi'));
    return out.slice(0, 8);
  }
  let state = { day: todayKey(), tab: 'day', q: '', editingId: null };

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(orders)); }
    catch (e) { toast(L('⚠ Không lưu được dữ liệu vào trình duyệt', '⚠ Could not save data in the browser')); }
    scheduleBackup(); try { updateBkBanner(); } catch (e) {}
  }
  function saveNotes() {
    try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }
    catch (e) { toast(L('⚠ Không lưu được ghi chú vào trình duyệt', '⚠ Could not save notes in the browser')); }
    scheduleBackup();
  }

  const summary = o => o.jobs.filter(j => j.items).map(j => `${tl(j.tailor)}: ${j.items}`).join(' • ');

  function eventsOf(o) {
    const list = [];
    o.jobs.forEach((j, idx) => {
      JOB_TYPES.forEach(type => {
        const e = j[type];
        if (e && e.at) list.push({ order: o, type, jobIdx: idx, tailor: j.tailor, items: j.items, at: e.at, done: !!e.done, colKey: colKeyOfTailor(j.tailor) });
      });
    });
    ['fitting', 'delivery'].forEach(type => {
      const e = o[type];
      if (e && e.at) {
        const customItems = (e.items && e.items.trim()) ? e.items.trim() : o.jobs.map(j => j.items).filter(Boolean).join(' • ');
        list.push({ order: o, type, jobIdx: null, tailor: '', items: customItems, lines: e.lines || [], extra: e.extra || '', at: e.at, done: !!e.done, colKey: type });
      }
    });
    return list.map(e => ({ ...e, date: e.at.slice(0, 10), time: e.at.slice(11, 16) }));
  }
  const allEvents = () => orders.flatMap(eventsOf).sort((a, b) => a.at.localeCompare(b.at));
  const keyOf = e => `${e.order.id}|${e.type}|${e.jobIdx ?? ''}`;

  function setDone(key, val) {
    const [id, type, jobIdx] = key.split('|');
    const o = orders.find(x => x.id === id); if (!o) return;
    const target = jobIdx !== '' ? (o.jobs[Number(jobIdx)] || {})[type] : o[type];
    if (target) target.done = val === undefined ? !target.done : val;
    if (target && Array.isArray(target.lines) && target.lines.length) target.lines.forEach(l => l.done = target.done);   // đánh dấu xong cả mốc = xong từng món
  }

  /* ===== RENDER ===== */
  let calMonth = state.day.slice(0, 7), lastDay = '';

  function render() {
    if (!keepPop) hidePopover();
    const day = state.day, rel = dayDiffLabel(day);
    $('#dateLabel').innerHTML = `<span>${esc(fmtDate(day))}</span>${lunarChip(day)}${rel ? `<span class="rel ${rel === L('Hôm nay', 'Today') ? '' : 'other'}">${rel}</span>` : ''}`;
    const onDay = state.tab === 'day';
    $('#home').classList.toggle('with-cal', onDay);
    if (onDay) {
      if (lastDay !== state.day) { calMonth = state.day.slice(0, 7); lastDay = state.day; }
      renderCal();
    }
    updateNoteBtn();
    $('#today').classList.toggle('is-today', state.day === todayKey());
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.tab));
    $('.datebar').style.display = onDay ? '' : 'none';
    $('#calc').style.display = state.tab === 'calc' ? 'block' : 'none';
    renderFilters();
    const lateN = allEvents().filter(e => flags(e).late).length, ln = $('#lateN');
    ln.hidden = !lateN; ln.textContent = lateN;
    if (onDay) renderDay(); else if (state.tab === 'week') renderWeek(); else if (state.tab === 'orders') renderOrders(); else if (state.tab === 'late') renderLate();
    else $('#view').innerHTML = '';
  }



  function renderFilters() {
    const box = $('#filters');
    if (state.tab !== 'orders' && state.tab !== 'late') { box.innerHTML = ''; box.style.display = 'none'; return; }
    box.style.display = '';
    box.innerHTML = `<input class="search" id="search" placeholder="${L('🔍 Tìm theo tên khách, thợ, sản phẩm...', '🔍 Search by customer, tailor, item...')}" aria-label="${L('Tìm kiếm', 'Search')}" value="${esc(state.q)}">`;
    $('#search').addEventListener('input', e => { state.q = e.target.value; state.tab === 'late' ? renderLate() : renderOrders(); });
  }

  function flags(e) {
    // Chưa hẹn giờ: chỉ coi là quá hạn khi đã qua ngày, không bao giờ "sắp đến giờ"
    if (!hasTime(e.at)) return { late: !e.done && e.date < todayKey(), soon: false, diffMin: Infinity };
    const now = nowKey(), diffMin = (new Date(e.at) - new Date(now)) / 60000;
    return { late: !e.done && e.at < now, soon: !e.done && diffMin >= 0 && diffMin <= SOON_MINUTES, diffMin };
  }
  const checkbox = e => `<input type="checkbox" data-toggle="${keyOf(e)}" aria-label="${L('Đã xong', 'Done')}" ${e.done ? 'checked' : ''}>`;

  function eventHTML(e) {
    const info = EVENT_TYPES[e.type] || { label: e.type, color: '#64748b' }, f = flags(e);
    const tail = e.tailor ? `<span class="badge" style="background:${tailorColor(e.tailor)}">🧵 ${esc(tl(e.tailor))}</span>` : '';
    const flag = f.late ? ` <span class="badge late">${L('Quá hạn', 'Overdue')}</span>` : f.soon ? ` <span class="badge soon">${Math.max(1, Math.round(f.diffMin))}${L('p', 'm')}</span>` : '';
    return `<div class="event ${e.done ? 'done' : ''} ${f.late ? 'late' : ''}" style="--c:${info.color}">
      ${checkbox(e)}
      <div class="time">${fmtCompactDateTime(e.at)}</div>
      <div class="body">
        <div class="title"><span class="badge">${info.label}</span> ${tail}${flag}</div>
        <div class="title" style="margin-top:3px; font-weight:700">${esc(e.order.name)}</div>
        <div class="meta">🕒 ${esc(fmtFull(e.at))}${e.items ? '<br>🧵 ' + L('Đồ: ', 'Items: ') + esc(e.items) : ''}</div>
      </div>
      <button type="button" class="small edit-btn" data-edit="${e.order.id}">${L('Sửa', 'Edit')}</button></div>`;
  }

  function groupEvents(list) {
    const map = new Map();
    list.forEach(e => {
      const k = `${e.order.id}_${e.colKey}`;
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(e);
    });
    return [...map.values()].map(evs => {
      evs.sort((x, y) => x.at.localeCompare(y.at));
      return { evs, done: evs.every(e => e.done), first: evs[0] };
    });
  }

  const popAttrs = (e, itemsText, done, keys = '') =>
    `data-pop="${e.order.id}" data-at="${esc(e.at)}" data-items="${esc(itemsText)}" data-note="${esc(e.order.note)}" data-done="${done ? '1' : '0'}" data-keys="${esc(keys)}"`;
  const groupItems = g => [...new Set(g.evs.map(e => e.items).filter(Boolean))].join(' • ');

  function colCardHTML(g) {
    const e0 = g.first, evs = g.evs;
    const color = e0.tailor ? tailorColor(e0.tailor) : (EVENT_TYPES[e0.type] ? EVENT_TYPES[e0.type].color : '#1a73e8');
    const fl = evs.map(flags);
    const late = fl.some(f => f.late), soonF = fl.filter(f => f.soon).sort((x, y) => x.diffMin - y.diffMin)[0];
    const itemsText = groupItems(g);
    const flag = late ? `<span class="badge late">${L('Quá hạn', 'Overdue')}</span>` : soonF ? `<span class="badge soon">${Math.max(1, Math.round(soonF.diffMin))}${L('p', 'm')}</span>` : '';

    let subEventsHTML = '';
    if (e0.tailor) {
      subEventsHTML = `<div class="sub-events-row">` + evs.map(subEv => {
        const info = EVENT_TYPES[subEv.type];
        return `<span class="sub-chip ${subEv.done ? 'is-done' : ''}" data-quick-toggle="${keyOf(subEv)}" title="${esc(info.label)} · ${L('bấm để đánh dấu xong/chưa', 'click to toggle done')}">
          <span>${info.chip}</span> <span class="chip-time">${fmtTimeOnly(subEv.at)}</span>${subEv.done ? ' ✔' : ''}
        </span>`;
      }).join('') + `</div>`;
    }

    return `<div class="ccard ${g.done ? 'done' : ''} ${late ? 'late' : ''} ${soonF ? 'soon' : ''}" style="--c:${color}">
      <button type="button" class="edit-btn" data-edit="${e0.order.id}" title="${L('Sửa đơn', 'Edit order')}" aria-label="${L('Sửa đơn', 'Edit order')}">✎</button>
      <div class="ccard-row1">
        <input type="checkbox" data-toggle="${evs.map(keyOf).join(',')}" aria-label="${L('Đã xong', 'Done')}" ${g.done ? 'checked' : ''}>
        <span class="ctitle" ${popAttrs(e0, itemsText, g.done, evs.map(keyOf).join(','))}>${esc(e0.order.name)}</span>
      </div>
      ${e0.tailor && !flag ? '' : `<div class="ccard-row2">${e0.tailor ? '' : `<span class="ctime">${fmtTimeOnly(e0.at)}</span>`} ${flag}</div>`}
      ${(e0.lines && e0.lines.length && !e0.tailor)
        ? `<div class="clines" ${popAttrs(e0, itemsText, g.done, evs.map(keyOf).join(','))}>${e0.lines.map(l => `<span class="cl ${l.done ? 'is-done' : ''}" title="${esc(l.note)}"><b>${l.qty}</b> ${esc(l.name)}${l.note ? '<i>*</i>' : ''}</span>`).join('')}${e0.extra ? `<span class="cl-extra">${esc(e0.extra)}</span>` : ''}</div>`
        : (itemsText ? `<div class="citems" ${popAttrs(e0, itemsText, g.done, evs.map(keyOf).join(','))}>🧵 ${esc(itemsText)}</div>` : '')}
      ${subEventsHTML}
    </div>`;
  }

  function boardColumns(evs) {
    const cols = TAILORS.filter(t => t.fixed).map(t => ({ key: t.name, title: `🧵 ${L('Thợ', 'Tailor')}: ${tl(t.name)}`, color: t.color }));
    cols.push({ key: 'fitting', title: L('👤 Lịch khách thử đồ', '👤 Customer fitting schedule'), color: EVENT_TYPES.fitting.color });
    cols.push({ key: 'delivery', title: L('✅ Lịch khách lấy đồ', '✅ Customer pickup schedule'), color: EVENT_TYPES.delivery.color });
    // Cột "Khác" chỉ hiện khi thực sự có lịch của thợ khác -> không bị mất dữ liệu
    if (evs.some(e => e.colKey === OTHER)) cols.push({ key: OTHER, title: `🧵 ${L('Thợ', 'Tailor')}: ${tl(OTHER)}`, color: tailorColor(OTHER) });
    return cols;
  }

  const colOpen = new Set();
  function renderDay() {
    const evs = allEvents();
    const dayEvs = evs.filter(e => e.date === state.day);
    let html = '';
    if (state.day === todayKey()) {
      const over = evs.filter(e => !e.done && e.date < state.day);
      if (over.length) html += `<div class="group-title overdue">⚠ ${L('Việc quá hạn chưa hoàn thành', 'Overdue unfinished tasks')} (${over.length})</div>` + over.map(eventHTML).join('');
    }
    const cols = boardColumns(evs);
    html += `<div class="board" style="--n:${cols.length > 4 ? 5 : 4}">` + cols.map(c => {
      const list = groupEvents(dayEvs.filter(e => e.colKey === c.key)), done = list.filter(g => g.done).length;
      list.sort((a, b) => a.done - b.done);   // việc chưa xong lên trên, việc đã xong xuống dưới (giữ thứ tự giờ)
      // Cột khách: tổng số món đã giao / cần giao trong ngày
      let pcs = '';
      if (c.key === 'fitting' || c.key === 'delivery') {
        const ls = dayEvs.filter(e => e.colKey === c.key).flatMap(e => e.lines || []), tot = ls.reduce((a, l) => a + l.qty, 0);
        if (tot) pcs = `<div class="col-sub">🧵 ${ls.filter(l => l.done).reduce((a, l) => a + l.qty, 0)}/${tot} ${L('món đã giao/lấy', 'items handed over')}</div>`;
      }
      const upG = groupEvents(evs.filter(e => e.colKey === c.key && e.date > state.day)).slice(0, 5);

      const nextHTML = upG.length ? `<div class="cnext"><div class="cnext-title">${L('Sắp tới', 'Upcoming')}</div>${upG.map(g => {
        const e = g.first;
        return `<div class="cnext-item ${g.done ? 'is-done' : ''}" ${popAttrs(e, groupItems(g), g.done, g.evs.map(keyOf).join(','))}>
          <div class="cnext-info" title="${esc(e.order.name)}"><b>${fmtCompactDateTime(e.at)}</b> · <b>${esc(e.order.name)}</b></div>
          <button type="button" class="edit-btn" style="position:static;" data-edit="${e.order.id}" aria-label="${L('Sửa đơn', 'Edit order')}">✎</button>
        </div>`;
      }).join('')}</div>` : '';

      // Điện thoại: cột trống hoặc đã xong hết thì thu gọn thành một dòng, chạm vào tiêu đề để mở
      const collapsible = list.length === 0 || done === list.length, ckey = state.day + '|' + c.key, isOpen = colOpen.has(ckey);
      const hint = !collapsible ? '' : list.length === 0 ? L('Trống', 'Empty') : L('✔ Xong hết', '✔ All done');
      return `<section class="col ${collapsible ? 'collapsible' : ''} ${collapsible && isOpen ? 'is-open' : ''}" data-ckey="${esc(ckey)}" style="--c:${c.color}">
        <div class="col-head"><b>${c.title}</b><span>${done}/${list.length}</span><em class="col-hint">${collapsible ? hint + (isOpen ? " ▾" : " ▸") : ""}</em></div>${pcs}
        <div class="col-body">${list.length ? list.map(colCardHTML).join('') : `<div class="col-empty">${L('Không có lịch ngày này', 'Nothing scheduled for this day')}</div>`}${nextHTML}</div>
      </section>`;
    }).join('') + `</div>`;
    $('#view').innerHTML = html;
  }

  function renderWeek() {
    const evs = allEvents();
    let html = '';
    for (let i = 0; i < 7; i++) {
      const k = addDays(todayKey(), i), list = evs.filter(e => e.date === k);
      html += `<div class="group-title">${esc(fmtDate(k))} · 🌙 ${lunarShort(k)} (${list.length})</div>`;
      html += list.length ? list.map(eventHTML).join('') : `<div style="color:var(--muted);padding:4px">${L('Không có lịch', 'Nothing scheduled')}</div>`;
    }
    $('#view').innerHTML = html;
  }

  function stepHTML(e) {
    const info = EVENT_TYPES[e.type] || { label: e.type, color: '#64748b' };
    return `<div class="step ${e.done ? 'done' : ''}" style="--c:${e.tailor ? tailorColor(e.tailor) : info.color}">
      <div style="font-weight:600">${e.done ? '✔ ' : ''}${info.label}${e.tailor ? ` · ${esc(tl(e.tailor))}` : ''}</div>
      <div>${esc(fmtFull(e.at))}</div>
      ${e.items ? `<div style="color:var(--muted)">🧵 ${esc(e.items)}</div>` : ''}
      </div>`;
  }

  /* Thẻ "Trễ / quá hạn": mọi mốc lịch đã qua giờ mà chưa đánh dấu xong, cũ nhất lên trước */
  function renderLate() {
    const q = state.q.trim().toLowerCase(), today = todayKey();
    const list = allEvents().filter(e => flags(e).late)
      .filter(e => !q || [e.order.name, e.items, e.tailor || '', (EVENT_TYPES[e.type] || {}).label || '', e.order.note].join(' ').toLowerCase().includes(q))
      .sort((a, b) => a.at.localeCompare(b.at));
    if (!list.length) { $('#view').innerHTML = `<div class="empty">${q ? L('Không tìm thấy mục phù hợp.', 'No matching items.') : L('🎉 Không có việc nào trễ hoặc quá hạn.', '🎉 Nothing is late or overdue.')}</div>`; return; }
    const days = k => Math.round((parseKey(today) - parseKey(k)) / 86400000);
    let html = `<div class="group-title overdue">⚠ ${L('Việc trễ / quá hạn chưa hoàn thành', 'Late / overdue unfinished tasks')} (${list.length})</div>`, last = '';
    list.forEach(e => {
      if (e.date !== last) { last = e.date; const d = days(e.date); html += `<div class="late-days">${esc(fmtDate(e.date))} · ${d > 0 ? L(`trễ ${d} ngày`, `${d} day${d > 1 ? 's' : ''} late`) : L('hôm nay, đã qua giờ hẹn', 'today, past the set time')}</div>`; }
      html += eventHTML(e);
    });
    $('#view').innerHTML = html;
  }

  function renderOrders() {
    const q = state.q.trim().toLowerCase();
    const list = orders.filter(o => !q || [o.name, summary(o), o.note, o.fitting.items, o.delivery.items].join(' ').toLowerCase().includes(q))
      .sort((a, b) => (a.delivery.at || '9').localeCompare(b.delivery.at || '9'));
    if (!list.length) { $('#view').innerHTML = `<div class="empty">${orders.length ? L('Không tìm thấy đơn phù hợp.', 'No matching orders found.') : L('Chưa có đơn nào.', 'No orders yet.')}</div>`; return; }
    $('#view').innerHTML = list.map(o => {
      const evs = eventsOf(o).sort((a, b) => a.at.localeCompare(b.at));
      return `<div class="order-card">
        <div class="order-head"><b>${esc(o.name)}</b>
          <button type="button" class="small" data-edit="${o.id}">${L('Sửa', 'Edit')}</button></div>
        <div class="meta">${esc(summary(o)) || '—'}${o.note ? ` · 📝 ${esc(o.note)}` : ''}</div>
        <div class="steps">${evs.length ? evs.map(stepHTML).join('') : `<div class="meta">${L('Chưa có mốc lịch nào.', 'No schedule entries yet.')}</div>`}</div></div>`;
    }).join('');
  }

  /* ===== FORM THÊM / SỬA ===== */
  const dlg = $('#dlg');

  function timeOptions(sel, emptyLabel = L('-- Giờ --', '-- Time --')) {
    const slots = [];
    for (let h = 6; h <= 22; h++) for (const m of [0, 15, 30, 45]) { if (h === 22 && m > 0) break; slots.push(`${pad(h)}:${pad(m)}`); }
    if (sel && !slots.includes(sel)) { slots.push(sel); slots.sort(); }
    return `<option value="">${emptyLabel}</option>` + slots.map(s => `<option value="${s}" ${s === sel ? 'selected' : ''}>${fmtHM(s)}</option>`).join('');
  }

  function dtBlock(type, v = emptyEv()) {
    const [d = '', t = ''] = (v.at || '').split('T'), hm = t.slice(0, 5);
    return `<div class="tl-block" data-type="${type}" data-done="${v.done ? 1 : 0}" style="--c:${EVENT_TYPES[type].color}">
      <span class="tl-label">${EVENT_TYPES[type].label}</span>
      <select class="dt-time" aria-label="${L('Giờ', 'Time')}">${timeOptions(hm)}</select>
      <input type="date" class="dt-date" aria-label="${L('Ngày', 'Date')}" value="${esc(d)}">
      <button type="button" class="clear" data-q="clear" title="${L('Xóa mốc này', 'Clear this entry')}" aria-label="${L('Xóa mốc này', 'Clear this entry')}">✕</button></div>`;
  }

  const lineRowHTML = l => `<div class="line-row ${l.done ? 'is-done' : ''}" data-done="${l.done ? 1 : 0}">
      <div class="qty"><button type="button" data-qstep="-1" aria-label="-">−</button><input class="l-qty" inputmode="numeric" value="${l.qty}" aria-label="${L('Số lượng', 'Quantity')}"><button type="button" data-qstep="1" aria-label="+">+</button></div>
      <input class="l-name" placeholder="${L('Tên món', 'Item')}" value="${esc(l.name)}" aria-label="${L('Tên món', 'Item')}">
      <input class="l-note" placeholder="${L('Ghi chú', 'Note')}" value="${esc(l.note)}" aria-label="${L('Ghi chú', 'Note')}">
      <button type="button" class="l-del" title="${L('Xóa món này', 'Remove item')}" aria-label="${L('Xóa món này', 'Remove item')}">✕</button>
    </div>`;

  function custDtBlock(type, v = emptyEv()) {
    const [d = '', t = ''] = (v.at || '').split('T'), hm = t.slice(0, 5);
    const free = (v.lines && v.lines.length) ? (v.extra || '') : (v.items || '');   // đơn cũ nhập chữ tự do -> vào ô ghi chú, không mất
    return `<div class="cust-card-wrap" style="--c:${EVENT_TYPES[type].color}">
      <div class="tl-block" data-type="${type}" data-done="${v.done ? 1 : 0}">
        <span class="tl-label">${EVENT_TYPES[type].label}</span>
        <select class="dt-time" aria-label="${L('Giờ (có thể để trống nếu chưa hẹn)', 'Time (optional if not set yet)')}">${timeOptions(hm, L('Chưa hẹn', 'TBD'))}</select>
        <input type="date" class="dt-date" aria-label="${L('Ngày', 'Date')}" value="${esc(d)}">
        <button type="button" class="clear" data-q="clear" title="${L('Xóa mốc này', 'Clear this entry')}" aria-label="${L('Xóa mốc này', 'Clear this entry')}">✕</button>
      </div>
      <div class="lines-box" data-lines="${type}">
        <div class="lines-head">${L('🧵 Danh sách đồ', '🧵 Items')}</div>
        <div class="lines-list">${(v.lines || []).map(lineRowHTML).join('')}</div>
        <div class="lines-add">${ITEM_PRESETS.map(n => `<button type="button" class="chip-add" data-chip="${esc(n)}">＋ ${esc(n)}</button>`).join('')}<button type="button" class="chip-add alt" data-line-custom>＋ ${L('Món khác', 'Other')}</button></div>
      </div>
      <input class="cust-items-input" data-cust-items="${type}" placeholder="${L('Ghi chú thêm (tùy chọn)', 'Extra note (optional)')}" title="${L('Để trống cả danh sách đồ và ô này = lấy theo đồ của thợ', 'Leave the item list and this field empty = use the tailor\'s items')}" value="${esc(free)}">
    </div>`;
  }

  function readBlock(root, type) {
    const b = root.querySelector(`.tl-block[data-type="${type}"]`);
    if (!b) return emptyEv();
    const d = $('.dt-date', b).value, t = $('.dt-time', b).value;
    const itemsEl = root.querySelector(`input[data-cust-items="${type}"]`);
    const box = root.querySelector(`.lines-box[data-lines="${type}"]`);
    const lines = box ? [...box.querySelectorAll('.line-row')].map(r => normLine({ qty: $('.l-qty', r).value, name: $('.l-name', r).value, note: $('.l-note', r).value, done: r.dataset.done === '1' })).filter(l => l.name) : [];
    const extra = itemsEl ? itemsEl.value.trim() : '';
    const items = [lineText(lines), extra].filter(Boolean).join(' • ');
    const done = lines.length ? lines.every(l => l.done) : b.dataset.done === '1';
    // Khách thử/lấy đồ (có ô itemsEl): chỉ cần ngày, giờ có thể chưa hẹn
    return { at: d && (t || itemsEl) ? `${d}T${t}` : '', items, extra, lines, done };
  }

  function tailorOptions(current) {
    const names = TAILORS.map(t => t.name);
    if (current && !names.includes(current)) names.push(current);
    return names.map(n => `<option value="${esc(n)}" ${n === current ? 'selected' : ''}>${esc(tl(n))}</option>`).join('');
  }

  function jobHTML(j, fixed) {
    const head = fixed
      ? `<div class="job-title">${esc(tl(j.tailor))}</div>`
      : `<select class="j-tailor" aria-label="${L('Thợ', 'Tailor')}">${tailorOptions(j.tailor)}</select>`;
    return `<div class="job" data-tailor="${esc(j.tailor)}" ${fixed ? 'data-fixed="1"' : ''} style="--c:${tailorColor(j.tailor)}">
      ${fixed
        ? `<div class="job-top">${head}<input class="j-items" placeholder="${L('Đồ của thợ này', 'Items for this tailor')}" aria-label="${L('Đồ của thợ này', 'Items for this tailor')}" value="${esc(j.items)}"></div>`
        : `<div class="job-top job-top-other">${head}<span class="j-other-hint">${L('Thợ khác', 'Other tailor')}</span><button type="button" class="small rm-job" title="${L('Xóa thợ này', 'Remove this tailor')}" aria-label="${L('Xóa thợ này', 'Remove this tailor')}">✕</button></div>
      <div class="job-top"><input class="j-items" placeholder="${L('Đồ của thợ này', 'Items for this tailor')}" aria-label="${L('Đồ của thợ này', 'Items for this tailor')}" value="${esc(j.items)}"></div>`}
      ${JOB_TYPES.map(t => dtBlock(t, j[t])).join('')}
    </div>`;
  }

  function openForm(id) {
    hidePopover();
    state.editingId = id || null;
    const o = id ? orders.find(x => x.id === id) : null;
    $('#dlgTitle').textContent = o ? L('Sửa lịch', 'Edit schedule') : L('Thêm lịch', 'Add schedule');
    $('#fName').value = o ? o.name : '';
    $('#acList').classList.remove('open');
    $('#fNote').value = o ? o.note : '';

    const jobs = o ? o.jobs : [], used = new Set();
    const fixedNames = TAILORS.filter(t => t.fixed).map(t => t.name);
    const fixedJobs = fixedNames.map(n => { const j = jobs.find(x => x.tailor === n && !used.has(x)); if (j) used.add(j); return j || newJob(n); });
    $('#colLeft').innerHTML = jobHTML(fixedJobs[0], true);
    $('#colRight').innerHTML = jobHTML(fixedJobs[1], true);
    // Các thợ còn lại (không còn bị mất khi sửa đơn)
    $('#jobsBox').innerHTML = jobs.filter(j => !used.has(j)).map(j => jobHTML(j, false)).join('');
    $('#custBox').innerHTML = custDtBlock('fitting', o ? o.fitting : emptyEv()) + custDtBlock('delivery', o ? o.delivery : emptyEv());

    $('#btnDelete').style.visibility = o ? 'visible' : 'hidden';
    dlg.showModal();
    if (!o) $('#fName').focus();
  }

  function submitForm(ev) {
    ev.preventDefault();
    const name = $('#fName').value.trim();
    if (!name) { toast(L('⚠ Vui lòng nhập tên khách', '⚠ Please enter the customer name')); $('#fName').focus(); return; }

    // Kiểm tra mốc chỉ nhập ngày hoặc chỉ nhập giờ (trước đây bị mất âm thầm)
    for (const b of dlg.querySelectorAll('.tl-block')) {
      const d = $('.dt-date', b).value, t = $('.dt-time', b).value;
      if ((d && !t && !b.closest('.cust-card-wrap')) || (!d && t)) {
        toast(L(`⚠ Mốc "${$('.tl-label', b).textContent.trim()}" cần nhập đủ cả ngày và giờ`, `⚠ "${$('.tl-label', b).textContent.trim()}" needs both a date and a time`));
        (d ? $('.dt-time', b) : $('.dt-date', b)).focus();
        return;
      }
    }

    const jobs = [...dlg.querySelectorAll('.job')].map(el => ({
      tailor: el.dataset.fixed ? el.dataset.tailor : $('.j-tailor', el).value,
      items: $('.j-items', el).value.trim(),
      pickupFitting: readBlock(el, 'pickupFitting'), pickupRepair: readBlock(el, 'pickupRepair'), pickupFinished: readBlock(el, 'pickupFinished')
    })).filter(j => j.items || JOB_TYPES.some(t => j[t].at));

    const right = $('#custBox');
    const data = { name, note: $('#fNote').value.trim(), jobs, fitting: readBlock(right, 'fitting'), delivery: readBlock(right, 'delivery') };

    if (!eventsOf({ ...data, id: 'x' }).length) {
      toast(L('⚠ Hãy nhập ít nhất một mốc ngày giờ để lịch hiện ra trang chủ', '⚠ Enter at least one date/time so the schedule shows on the home page'));
      return;
    }

    if (state.editingId) {
      const i = orders.findIndex(o => o.id === state.editingId);
      if (i >= 0) orders[i] = { ...orders[i], ...data }; else orders.push({ id: uid(), ...data });
    } else orders.push({ id: uid(), ...data });
    rememberCustomer(name); saveCustomers();
    save(); dlg.close();
    render(); toast(L(`✔ Đã lưu đơn hàng của ${name}`, `✔ Saved order for ${name}`));
  }

  dlg.addEventListener('click', e => {
    const clr = e.target.closest('[data-q="clear"]');
    if (clr) {
      const b = clr.closest('.tl-block');
      $('.dt-date', b).value = ''; $('.dt-time', b).value = ''; b.dataset.done = '0';
      return;
    }
    const rm = e.target.closest('.rm-job');
    if (rm) { rm.closest('.job').remove(); return; }
  });
  /* Danh sách đồ trong form: nút món nhanh, +/− số lượng, xóa dòng */
  function addLine(box, name, qty) {
    const list = $('.lines-list', box);
    if (name) {   // món này đã có (chưa giao) -> cộng thêm số lượng thay vì tạo dòng mới
      const ex = [...list.querySelectorAll('.line-row')].find(r => r.dataset.done !== '1' && !$('.l-note', r).value.trim() && $('.l-name', r).value.trim().toLowerCase() === name.toLowerCase());
      if (ex) { const q = $('.l-qty', ex); q.value = Math.min(99, (parseInt(q.value, 10) || 0) + qty); return ex; }
    }
    list.insertAdjacentHTML('beforeend', lineRowHTML({ qty, name, note: '', done: false }));
    return list.lastElementChild;
  }
  dlg.addEventListener('click', e => {
    const box = e.target.closest('.lines-box'); if (!box) return;
    const chip = e.target.closest('[data-chip]');
    if (chip) { addLine(box, chip.dataset.chip, 1); return; }
    if (e.target.closest('[data-line-custom]')) { $('.l-name', addLine(box, '', 1)).focus(); return; }
    const del = e.target.closest('.l-del');
    if (del) { del.closest('.line-row').remove(); return; }
    const qb = e.target.closest('[data-qstep]');
    if (qb) { const inp = $('.l-qty', qb.closest('.line-row')); inp.value = Math.min(99, Math.max(1, (parseInt(inp.value, 10) || 1) + Number(qb.dataset.qstep))); }
  });
  dlg.addEventListener('input', e => { if (e.target.classList.contains('l-qty')) e.target.value = e.target.value.replace(/\D/g, '').slice(0, 2); });
  dlg.addEventListener('keydown', e => {   // Enter trong dòng đồ: không gửi cả form
    if (e.key !== 'Enter' || !e.target.closest || !e.target.closest('.line-row')) return;
    e.preventDefault();
    const row = e.target.closest('.line-row');
    if (e.target.classList.contains('l-note')) { const r = addLine(row.closest('.lines-box'), '', 1); $('.l-name', r).focus(); }
    else if (e.target.classList.contains('l-name')) $('.l-note', row).focus();
  });
  // Bấm ra ngoài để đóng, nhưng chỉ khi nhấn VÀ nhả chuột đều trên nền mờ.
  // (Kéo chọn chữ trong ô nhập rồi nhả chuột ra ngoài sẽ không làm mất dữ liệu đang gõ.)
  let downOnBackdrop = false;
  dlg.addEventListener('mousedown', e => { downOnBackdrop = e.target === dlg; });
  dlg.addEventListener('click', e => { if (e.target === dlg && downOnBackdrop) dlg.close(); downOnBackdrop = false; });
  dlg.addEventListener('change', e => {
    // Chọn giờ mà chưa có ngày -> tự điền ngày hôm nay
    if (e.target.classList.contains('dt-time') && e.target.value) {
      const dateEl = e.target.closest('.tl-block').querySelector('.dt-date');
      if (dateEl && !dateEl.value) dateEl.value = todayKey();
    }
    if (e.target.classList.contains('j-tailor')) {
      const job = e.target.closest('.job');
      job.dataset.tailor = e.target.value;
      job.style.setProperty('--c', tailorColor(e.target.value));
    }
  });
  $('#addJob').onclick = () => {
    const box = $('#jobsBox');
    box.insertAdjacentHTML('beforeend', jobHTML(newJob(OTHER), false));
    const last = box.lastElementChild; last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    $('.j-items', last).focus();
  };

  /* ===== GỢI Ý TÊN KHÁCH TRONG FORM ===== */
  const fName = $('#fName'), acList = $('#acList');
  let acItems = [], acActive = -1;

  const acHighlight = (name, start, len) => (start < 0 || !len) ? esc(name)
    : esc(name.slice(0, start)) + '<b>' + esc(name.slice(start, start + len)) + '</b>' + esc(name.slice(start + len));

  function acClose() {
    acList.classList.remove('open'); acActive = -1;
    fName.setAttribute('aria-expanded', 'false'); fName.removeAttribute('aria-activedescendant');
  }
  function acRender() {
    const nq = nameKey(fName.value), list = suggestCustomers(fName.value);
    // Chỉ còn đúng một gợi ý và trùng khít với chữ đã gõ -> không cần hiện
    const shown = list.length === 1 && nameKey(list[0].c.name) === nq ? [] : list;
    acItems = shown; acActive = -1;
    if (!shown.length) { acClose(); return; }
    acList.innerHTML = (nq ? '' : `<div class="ac-head">${L('Khách gần đây', 'Recent customers')}</div>`) + shown.map((s, i) => {
      const cnt = orderCount(s.c.name);
      return `<div class="ac-item" role="option" id="ac-${i}" data-i="${i}"><span class="ac-name">${acHighlight(s.c.name, s.start, nq.length)}</span>${cnt ? `<span class="ac-meta">${cnt} ${L('đơn', cnt === 1 ? 'order' : 'orders')}</span>` : ''}<button type="button" class="ac-del" data-del="${i}" title="${L('Xóa tên này khỏi danh sách gợi ý', 'Remove this name from suggestions')}" aria-label="${L('Xóa tên này khỏi gợi ý', 'Remove from suggestions')}">✕</button></div>`;
    }).join('');
    acList.classList.add('open'); fName.setAttribute('aria-expanded', 'true');
  }
  function acSetActive(i) {
    const els = acList.querySelectorAll('.ac-item');
    acActive = i;
    els.forEach((el, k) => { el.classList.toggle('active', k === i); el.setAttribute('aria-selected', k === i ? 'true' : 'false'); });
    if (els[i]) { els[i].scrollIntoView({ block: 'nearest' }); fName.setAttribute('aria-activedescendant', els[i].id); }
  }
  function acPick(i) {
    const s = acItems[i]; if (!s) return;
    fName.value = s.c.name; acClose(); fName.focus();
  }

  fName.addEventListener('input', acRender);
  fName.addEventListener('focus', () => { if (!fName.value.trim()) acRender(); });
  fName.addEventListener('blur', acClose);
  fName.addEventListener('keydown', e => {
    if (e.isComposing) return;
    const open = acList.classList.contains('open'), n = acItems.length;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!open) { acRender(); if (!acItems.length) return; }
      const cnt = acItems.length;
      acSetActive(e.key === 'ArrowDown' ? (acActive + 1) % cnt : (acActive <= 0 ? cnt - 1 : acActive - 1));
    } else if (e.key === 'Enter' && open && acActive >= 0 && acActive < n) {
      e.preventDefault(); acPick(acActive);     // chọn gợi ý, không gửi form
    } else if (e.key === 'Escape' && open) {
      e.preventDefault(); e.stopPropagation(); acClose();   // chỉ đóng gợi ý, không đóng cả form
    } else if (e.key === 'Tab') acClose();
  });
  // mousedown (không phải click) để ô nhập không bị mất focus trước khi chọn
  acList.addEventListener('mousedown', e => {
    e.preventDefault();
    const del = e.target.closest('[data-del]');
    if (del) {

  function parseLegacyItems(text) {
    const segs = String(text).split(/[,;+\n]|\s+và\s+/i).map(x => x.trim()).filter(Boolean);
    const lines = [], rest = [];
    for (const seg of segs) {
      const m = seg.match(/^(\d{1,2})\s*(?:x\s+|cái\s+|chiếc\s+|bộ\s+)?(.+)$/i);
      if (!m) { rest.push(seg); continue; }
      const body = m[2].trim();
      let name = '', note = '';
      const p = body.match(/^([^()]+?)\s*\(([^)]*)\)\s*(.*)$/);
      if (p) { name = p[1].trim(); note = [p[2].trim(), p[3].trim()].filter(Boolean).join(' · '); }
      else { const w = body.split(/\s+/); if (w.length <= 3) name = body; else { name = w.slice(0, 2).join(' '); note = w.slice(2).join(' '); } }
      if (!name || /\d/.test(name)) { rest.push(seg); continue; }
      if (!/^(jeans|pants|trousers|shorts|glasses)$/i.test(name)) name = name.replace(/^([a-z]{3,})s$/i, (x, b) => /ss$/i.test(x) ? x : b);   // jackets -> jacket
      name = name.charAt(0).toUpperCase() + name.slice(1);
      lines.push({ qty: parseInt(m[1], 10), name, note, done: false });
    }
    return { lines, rest: rest.join(', ') };
  }
  function migrateLegacyItems() {
    const todo = [];
    orders.forEach(o => ['fitting', 'delivery'].forEach(type => {
      const e = o[type];
      if (e && e.at && !(e.lines || []).length && (e.items || '').trim()) { const r = parseLegacyItems(e.items); if (r.lines.length) todo.push({ o, e, r }); }
    }));
    if (!todo.length) { toast(L('Không có đơn cũ nào cần chuyển', 'No old orders need converting')); return; }
    const preview = todo.slice(0, 8).map(t => `• ${t.o.name}: “${t.e.items}” → ${lineText(t.r.lines)}${t.r.rest ? ' + ' + t.r.rest : ''}`).join('\n') + (todo.length > 8 ? `\n… +${todo.length - 8}` : '');
