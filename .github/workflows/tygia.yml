name: Cap nhat ty gia Vietcombank

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tai ty gia tu Vietcombank
        run: |
          curl -fsSL --retry 3 --max-time 30 -A "Mozilla/5.0" \
            -o tygia.tmp "https://portal.vietcombank.com.vn/Usercontrols/TVPortal.TyGia/pXML.aspx"
          grep -q "<Exrate" tygia.tmp
          mv tygia.tmp tygia.xml
      - name: Luu lai vao kho
        run: |
          git config user.name "tygia-bot"
          git config user.email "tygia-bot@users.noreply.github.com"
          git add tygia.xml
          git diff --cached --quiet || (git commit -m "Cap nhat ty gia" && git push)
